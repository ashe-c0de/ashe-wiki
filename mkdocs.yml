site_name: Ashe Wiki
site_url: https://ashe-wiki.github.io
site_author: Ashe
site_logo: logo.png 

repo_name: ashe-c0de/ashe-wiki
repo_url: https://github.com/ashe-c0de/ashe-wiki
edit_uri: edit/v1/docs/

copyright: Copyright &copy; 2024-Present <a href="https://github.com/ashe-c0de" target="_blank" rel="noopener noreferrer">Ashe</a>

theme:
  name: material
  language: en

  favicon: assets/favicon.png
  icon:
    logo: logo

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.path
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Noto Serif SC
    code: Roboto Mono

plugins:
#  - search
  - offline # 这个插件会处理字体和资源的本地化

markdown_extensions:

  - admonition
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

  - toc:
      permalink: true


extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js



nav:

  - Home: index.md

  - Lang:
      - Go:
          - "slice": lang/go/slice.md
          - "map": lang/go/map.md
          - "channel": lang/go/channel.md
          - "defer": lang/go/defer.md
          - "sync": lang/go/sync.md
          - "generics": lang/go/generics.md
          - "memory-escape": lang/go/memory-escape.md
          - "memory-leak": lang/go/memory-leak.md
          - "context": lang/go/context.md
          - "gmp": lang/go/gmp.md
          - "memory-allocator": lang/go/memory-allocator.md
      - Meditation:
          - "2025-12-14": lang/meditation/2025-12-14-diary.md
      - Rust:
          - Environment: lang/rust/environment.md
          - Web: lang/rust/web.md
      - Markdown:
          - Grammar: lang/markdown/grammar.md


  - Db:
      - MySQL: 
          - "index": db/mysql/ix.md
          - "b+tree": db/mysql/b+tree.md
          - "covering-index": db/mysql/covering-index.md
          - "index-failure": db/mysql/index-failure.md
          - "sql-flow": db/mysql/sql-flow.md
          - "脏读、不可重复读、幻读": db/mysql/dirty-read.md
          - "mvcc": db/mysql/mvcc.md
          - "join": db/mysql/join.md
      - Redis:
          - "struct": db/redis/struct.md    
          - "persistence-strategy": db/redis/persistence-strategy.md    
          - "eviction-policy": db/redis/eviction-policy.md    
  
  - Algo:
      - algo/index.md

  - DevOps:
      - "transactional-mq": devops/transactional-mq.md
      - "cache": devops/cache.md
      - "mq-loss": devops/mq-loss.md
      - "distributed-transaction": devops/distributed-transaction.md
      - "drate-limiting": devops/rate-limiting.md 
      - "distributed-lock": devops/distributed-lock.md 
  
  - Other:
      - other/index.md
