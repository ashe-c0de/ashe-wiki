site_name: Ashe Wiki
site_url: https://ashe-wiki.github.io
site_author: Ashe
site_logo: logo.png 

repo_name: ashe-c0de/ashe-wiki
repo_url: https://github.com/ashe-c0de/ashe-wiki
edit_uri: edit/v1/docs/

copyright: Copyright &copy; 2024-Present <a href="https://github.com/ashe-c0de" target="_blank" rel="noopener noreferrer">Ashe</a>

theme:
  name: material
  language: en

  favicon: assets/favicon.png
  icon:
    logo: logo

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
#    - navigation.sections
#    - navigation.expand
    - navigation.tabs
    - navigation.path
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Noto Serif SC
    code: Roboto Mono

plugins:
  - search:
      lang:
        - en
        - zh
  - offline

markdown_extensions:

  - admonition
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

  - toc:
      permalink: true
  - pymdownx.tilde    


extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js



