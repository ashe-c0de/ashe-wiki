name: Deploy Ashe Wiki

on:
  push:
    branches:
      - v1

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the archive repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Install MkDocs and Material theme
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material
          pip install mkdocs-glightbox

      # 3.1 自动替换Copyright中的Present
      - name: Smart Update Copyright Year
        run: |
          CURRENT_YEAR=$(date +%Y)
          if grep -qi "Present" mkdocs.yml; then
            echo "Detected 'Present'. Replacing with $CURRENT_YEAR..."
            sed -i -E "s/([0-9]{4})-Present/\1-$CURRENT_YEAR/gi" mkdocs.yml
            echo "Verification:"
            grep "copyright" mkdocs.yml
          else
            echo "No 'Present' found. Skipping replacement."
          fi

      # 4. Build the static site
      - name: Build site
        run: mkdocs build --clean --site-dir site

      # 5. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ashe-wiki/ashe-wiki.github.io
          publish_branch: main
          publish_dir: ./site
