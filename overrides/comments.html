{% if page.meta and page.meta.comments != false %}

<hr>

<details>
  <summary>Comments</summary>

  <script src="https://giscus.app/client.js"
          data-repo="ashe-c0de/ashe-wiki-comments"
          data-repo-id="REPO_ID"
          data-category="Blog Comments"
          data-category-id="CATEGORY_ID"
          data-mapping="pathname"
          data-reactions-enabled="1"
          data-input-position="bottom"
          data-theme="light"
          data-lang="en"
          crossorigin="anonymous"
          async>
  </script>

</details>

<script>
const updateGiscusTheme = () => {
  const theme = document.body.getAttribute("data-md-color-scheme");
  const iframe = document.querySelector("iframe.giscus-frame");
  if (!iframe) return;
  iframe.contentWindow.postMessage({
    giscus: {
      setConfig: {
        theme: theme === "slate" ? "dark" : "light"
      }
    }
  }, "https://giscus.app");
};
document.addEventListener("DOMContentLoaded", updateGiscusTheme);
</script>

{% endif %}
